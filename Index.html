<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disney World Wait Times & Deal Finder</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --great-bg: #064e3b;
      --great-text: #4ade80;
      --bad-bg: #450a0a;
      --bad-text: #fca5a5;
      --normal-bg: #3a506b;
      --normal-text: #e2e8f0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      padding-bottom: 40px;
    }

    header {
      position: sticky;
      top: 0;
      background-color: var(--bg);
      padding: 8px 0 12px 0;
      z-index: 100;
      border-bottom: 1px solid var(--normal-bg);
    }

    h1 {
      font-size: 1.25rem;
      margin: 0 0 10px 0;
      text-align: center;
    }

    .filter-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .filter-btn {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--normal-bg);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #2563eb;
      color: white;
      border-color: #3b82f6;
      font-weight: bold;
    }

    /* Proximity Panel Styles */
    .proximity-panel {
      background: var(--card-bg);
      border: 1px solid var(--normal-bg);
      border-radius: 12px;
      padding: 14px;
      margin-top: 15px;
      display: none;
    }

    .proximity-panel.active {
      display: block;
    }

    .proximity-controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
      align-items: center;
    }

    .proximity-controls select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--normal-bg);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    @media (min-width: 600px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 5px solid var(--normal-bg);
    }

    .card.GREAT { border-left-color: var(--great-text); }
    .card.BAD { border-left-color: var(--bad-text); }
    .card.CLOSED { opacity: 0.5; border-left-color: #64748b; }

    .ride-info {
      flex: 1;
      padding-right: 10px;
    }

    .park-tag {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .ride-name {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .benchmark {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .status-badge {
      text-align: right;
      min-width: 85px;
    }

    .wait-time {
      font-size: 1.3rem;
      font-weight: 800;
    }

    .badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      margin-top: 2px;
    }

    .badge.GREAT { background: var(--great-bg); color: var(--great-text); }
    .badge.BAD { background: var(--bad-bg); color: var(--bad-text); }
    .badge.NORMAL { background: var(--normal-bg); color: var(--normal-text); }
    .badge.CLOSED { background: #334155; color: #94a3b8; }
    .badge.net-value { background: #1e3a8a; color: #93c5fd; display: block; margin-top: 4px; }

    #loader {
      text-align: center;
      padding: 40px 0;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <h1>Disney World Wait Times</h1>
    <div class="filter-bar">
      <button class="filter-btn active" onclick="setFilter('ALL')">All Parks</button>
      <button class="filter-btn" onclick="setFilter('Magic Kingdom')">Magic Kingdom</button>
      <button class="filter-btn" onclick="setFilter('EPCOT')">EPCOT</button>
      <button class="filter-btn" onclick="setFilter('Hollywood Studios')">Hollywood Studios</button>
      <button class="filter-btn" onclick="setFilter('Animal Kingdom')">Animal Kingdom</button>
      <button class="filter-btn" onclick="setFilter('PROXIMITY')">📍 Deal Finder</button>
    </div>

    <!-- Proximity Park & Land Selector Drawer -->
    <div id="proximityPanel" class="proximity-panel">
      <div class="proximity-controls">
        <label for="dealParkSelect" style="font-size: 0.85rem; color: var(--text-muted);">Park:</label>
        <select id="dealParkSelect" onchange="updateLandDropdown()">
          <option value="Magic Kingdom">Magic Kingdom</option>
          <option value="EPCOT">EPCOT</option>
          <option value="Hollywood Studios">Hollywood Studios</option>
          <option value="Animal Kingdom">Animal Kingdom</option>
        </select>

        <label for="currentLandSelect" style="font-size: 0.85rem; color: var(--text-muted);">Current Land:</label>
        <select id="currentLandSelect" onchange="renderRides()">
          <!-- Populated dynamically based on selected park -->
        </select>
      </div>
      <div style="font-size: 0.75rem; color: var(--text-muted);">
        Rides sorted by <b>Net Value</b> (2026 Avg Wait minus Live Wait minus Walk Time).
      </div>
    </div>
  </header>

  <main>
    <div id="loader">Loading live wait times...</div>
    <div id="rideGrid" class="grid"></div>
  </main>

<script>
  // REPLACE WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwfWWOIM9arMMjSJvmKg8m4yQBih-epaRGMVnTDOyrP8SmZgEXcWahCAP_BEokyMve_lw/exec";

  let appData = null;
  let currentFilter = 'ALL';

  async function loadWaitTimes() {
    try {
      const response = await fetch(APPS_SCRIPT_URL);
      const data = await response.json();
      appData = data;
      document.getElementById('loader').style.display = 'none';
      updateLandDropdown();
      renderRides();
    } catch (err) {
      document.getElementById('loader').innerHTML = `<span style="color:var(--bad-text);">Error loading data: ${err.message}</span>`;
    }
  }

  function setFilter(filter) {
    currentFilter = filter;
    
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    const panel = document.getElementById('proximityPanel');
    if (filter === 'PROXIMITY') {
      panel.classList.add('active');
    } else {
      panel.classList.remove('active');
    }

    updateLandDropdown();
    renderRides();
  }

  function updateLandDropdown() {
    if (!appData || !appData.walkingMatrices) return;
    
    let targetPark = 'Magic Kingdom';
    if (currentFilter === 'PROXIMITY') {
      targetPark = document.getElementById('dealParkSelect').value;
    } else if (currentFilter !== 'ALL') {
      targetPark = currentFilter;
    }

    const landSelect = document.getElementById('currentLandSelect');
    const parkMatrix = appData.walkingMatrices[targetPark] || {};
    const lands = Object.keys(parkMatrix);

    landSelect.innerHTML = '';
    lands.forEach(land => {
      const opt = document.createElement('option');
      opt.value = land;
      opt.textContent = land;
      landSelect.appendChild(opt);
    });

    renderRides();
  }

  function renderRides() {
    if (!appData || !appData.rides) return;

    const grid = document.getElementById('rideGrid');
    grid.innerHTML = '';

    let ridesToRender = [...appData.rides];

    if (currentFilter === 'PROXIMITY') {
      const selectedPark = document.getElementById('dealParkSelect').value;
      const currentLand = document.getElementById('currentLandSelect').value;
      const parkMatrix = appData.walkingMatrices[selectedPark] || {};
      const landDistances = parkMatrix[currentLand] || {};

      // Filter to selected park, preserve exact r.currentWait, and compute net value
      ridesToRender = ridesToRender
        .filter(r => r.isOpen && r.park === selectedPark)
        .map(r => {
          const timeSaved = r.benchmarkWait - r.currentWait;
          const walkTime = landDistances[r.land] !== undefined ? landDistances[r.land] : 5;
          const netValue = timeSaved - walkTime;
          return { ...r, walkTime, netValue };
        })
        .sort((a, b) => b.netValue - a.netValue);

    } else if (currentFilter !== 'ALL') {
      ridesToRender = ridesToRender.filter(r => r.park === currentFilter);
    }

    if (ridesToRender.length === 0) {
      grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 20px;">No rides found.</div>`;
      return;
    }

    ridesToRender.forEach(r => {
      const card = document.createElement('div');
      const statusClass = r.isOpen ? r.status : 'CLOSED';
      card.className = `card ${statusClass}`;

      let badgeText = r.status;
      if (r.status === 'GREAT') badgeText = 'Great Deal 🟢';
      else if (r.status === 'BAD') badgeText = 'High Wait 🔴';
      else if (r.status === 'NORMAL') badgeText = 'Normal';

      let netValueHtml = '';
      if (currentFilter === 'PROXIMITY' && r.netValue !== undefined) {
        netValueHtml = `<span class="badge net-value">Net: +${r.netValue}m (${r.walkTime}m walk)</span>`;
      }

      card.innerHTML = `
        <div class="ride-info">
          <div class="park-tag">${r.park} • ${r.land}</div>
          <div class="ride-name">${r.rideName}</div>
          <div class="benchmark">2026 Avg: ${r.benchmarkWait}m</div>
        </div>
        <div class="status-badge">
          <div class="wait-time">${r.isOpen ? r.currentWait + 'm' : 'Closed'}</div>
          <span class="badge ${statusClass}">${r.isOpen ? badgeText : 'Closed'}</span>
          ${netValueHtml}
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // Initial load
  loadWaitTimes();
</script>

</body>
</html>
