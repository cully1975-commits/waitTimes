<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WDW Net Value Deal Finder</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 15px; background: #fdfdfd; color: #333; }
    h1 { font-size: 24px; color: #1a1a1a; }
    .panel { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    label { font-weight: 600; margin-right: 8px; font-size: 14px; }
    select { padding: 6px 12px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; margin-right: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; background: #fff; }
    th, td { padding: 10px; border-bottom: 1px solid #dee2e6; text-align: left; }
    th { background: #e9ecef; }
    .loading { font-style: italic; color: #666; }
  </style>
</head>
<body>

  <h1>🎢 WDW Proximity & Net Value Deal Finder</h1>
  
  <div class="panel">
    <div style="margin-bottom: 15px;">
      <label for="parkSelect">Select Park:</label>
      <select id="parkSelect" onchange="updateLandDropdown()">
        <option value="Magic Kingdom">Magic Kingdom</option>
        <option value="EPCOT">EPCOT</option>
        <option value="Hollywood Studios">Hollywood Studios</option>
        <option value="Animal Kingdom">Animal Kingdom</option>
      </select>

      <label for="currentLandSelect">Current Land:</label>
      <select id="currentLandSelect" onchange="calculateProximityDeals()">
        <!-- Dynamically populated -->
      </select>
    </div>

    <div id="proximityResults">
      <p class="loading">Loading live wait times and calculating deals...</p>
    </div>
  </div>

<script>
  // REPLACE WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwfWWOIM9arMMjSJvmKg8m4yQBih-epaRGMVnTDOyrP8SmZgEXcWahCAP_BEokyMve_lw/exec";

  let globalAppData = null;

  async function fetchAppData() {
    try {
      const response = await fetch(APPS_SCRIPT_URL);
      const data = await response.json();
      globalAppData = data;
      updateLandDropdown();
    } catch (err) {
      document.getElementById("proximityResults").innerHTML = `<p style="color:red;">Error fetching data: ${err.message}</p>`;
    }
  }

  function updateLandDropdown() {
    if (!globalAppData || !globalAppData.walkingMatrices) return;
    
    const selectedPark = document.getElementById("parkSelect").value;
    const landSelect = document.getElementById("currentLandSelect");
    const parkMatrix = globalAppData.walkingMatrices[selectedPark] || {};
    const lands = Object.keys(parkMatrix);

    landSelect.innerHTML = "";
    lands.forEach(land => {
      const opt = document.createElement("option");
      opt.value = land;
      opt.textContent = land;
      landSelect.appendChild(opt);
    });

    calculateProximityDeals();
  }

  function calculateProximityDeals() {
    if (!globalAppData || !globalAppData.rides) return;

    const selectedPark = document.getElementById("parkSelect").value;
    const currentLand = document.getElementById("currentLandSelect").value;
    const parkMatrix = globalAppData.walkingMatrices[selectedPark] || {};
    const landDistances = parkMatrix[currentLand] || {};

    // Map and score rides based on Net Value (Time Saved minus Walk Time)
    const scoredRides = globalAppData.rides
      .filter(ride => ride.isOpen && ride.park === selectedPark)
      .map(ride => {
        const timeSaved = ride.benchmarkWait - ride.currentWait;
        const walkTime = landDistances[ride.land] !== undefined ? landDistances[ride.land] : 5;
        const netValue = timeSaved - walkTime;

        return { ...ride, timeSaved, walkTime, netValue };
      })
      .sort((a, b) => b.netValue - a.netValue);

    renderProximityResults(scoredRides, currentLand);
  }

  function renderProximityResults(rides, startingLand) {
    const container = document.getElementById("proximityResults");
    
    if (rides.length === 0) {
      container.innerHTML = "<p>No open rides found for this park.</p>";
      return;
    }

    let html = `<h3>Best Net-Value Rides from ${startingLand}:</h3>`;
    html += `<table>`;
    html += `<tr><th>Attraction</th><th>Land</th><th>Live Wait</th><th>2026 Avg</th><th>Walk Time</th><th>Net Value</th></tr>`;

    rides.forEach(r => {
      // Color-code badge background based on net value score
      const rowColor = r.netValue >= 15 ? "#d4edda" : (r.netValue > 0 ? "#fff3cd" : "#f8d7da");
      html += `<tr style="background:${rowColor};">`;
      html += `<td><b>${r.rideName}</b></td>`;
      html += `<td>${r.land}</td>`;
      html += `<td>${r.currentWait}m</td>`;
      html += `<td>${r.benchmarkWait}m</td>`;
      html += `<td>${r.walkTime}m walk</td>`;
      html += `<td><b>+${r.netValue} mins</b></td>`;
      html += `</tr>`;
    });

    html += `</table>`;
    container.innerHTML = html;
  }

  // Initialize on page load
  fetchAppData();
</script>

</body>
</html>
